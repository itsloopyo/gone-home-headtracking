[workspace]
name = "gone-home-head-tracking"
version = "1.5.0"
description = "Head tracking mod for Gone Home with aim decoupling"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
# Reference stubs, compiled from the shared sources in the core submodule. net35 means
# pre-2017.3 Unity, so no UnityEngine.InputLegacyModule is produced - Input lives in
# UnityEngine.dll on that engine version.
setup = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/csharp/stubs/build-unity-stubs.ps1 -OutputPath src/GoneHomeHeadTracking/libs -TargetFramework net35"
# Opt in to building against the real game DLLs instead. Not the default: CI has no
# game, and a local build that differs from CI is how a member missing from the stubs
# passes here and fails on push.
setup-game = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1"
restore = { cmd = "dotnet restore src/GoneHomeHeadTracking/GoneHomeHeadTracking.csproj", depends-on = ["setup"] }
build = { cmd = "dotnet build src/GoneHomeHeadTracking/GoneHomeHeadTracking.csproj -c Release", depends-on = ["restore"] }
# Checks that every member reference the build emits resolves against the
# assemblies it binds to at runtime. Stub/engine shape drift (a property
# declared as a field, or the reverse) compiles cleanly and only fails in
# game. Needs the game installed; skips and succeeds without it.
verify-refs = { cmd = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/scripts/verify-assembly-refs.ps1 -GameId gone-home -BuildDir src/GoneHomeHeadTracking/bin/Release", depends-on = ["build"] }
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
# The config tests, among them the differential test in tests/config_differential, which holds
# the legacy import to the v1.5.0 reader it replaces on every published build's first-run file and
# on core's mutation corpus, then core's canonical config lint over the committed file and every
# file the test migrated.
test = { cmd = "dotnet test tests/GoneHomeHeadTracking.Tests/GoneHomeHeadTracking.Tests.csproj -c Release && node tests/config_differential/lint-migrated.mjs tests/GoneHomeHeadTracking.Tests/bin/Release/net48/migrated", depends-on = ["build"] }
# Rewrites config/CameraUnlock.ini from the config table after a change to a row, a comment or a
# default. The render test compares the two on every `pixi run test`, so the committed file cannot
# drift from the code.
render-config = { cmd = "dotnet test tests/GoneHomeHeadTracking.Tests/GoneHomeHeadTracking.Tests.csproj -c Release --filter FullyQualifiedName~ConfigTests.CommittedFileIsTheRenderedDefaults && node cameraunlock-core/scripts/encode-seed.mjs", env = { CAMERAUNLOCK_RENDER_CONFIG = "write" } }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test"] }
uninstall = "scripts/uninstall.cmd"
vanilla = "powershell -ExecutionPolicy Bypass -File scripts/vanilla.ps1"
clean = "dotnet clean src/GoneHomeHeadTracking/GoneHomeHeadTracking.csproj"
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"
update-deps = "echo No vendored dependencies to update."
# Checks the launcher contract against the built installer ZIP, and that the Nexus ZIP carries
# no config.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"
