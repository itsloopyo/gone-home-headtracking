# Gone Home Head Tracking Configuration
# Edit values below and restart the game to apply changes.
# Lines starting with # or ; are comments.

# --- Network ---
UdpPort = 4242

# --- Keybindings ---
# See https://docs.unity3d.com/ScriptReference/KeyCode.html for key names
RecenterKey = Home
ToggleKey = End
PositionToggleKey = PageUp
YawModeKey = PageDown

# --- Yaw Mode ---
# true = horizon-locked yaw around world up (default)
# false = camera-local yaw (matches dying-light-2/obra-dinn)
WorldSpaceYaw = true

# --- Sensitivity ---
YawSensitivity = 1.0
PitchSensitivity = 1.0
RollSensitivity = 1.0

# --- Smoothing ---
# Picked per connection from the tracker's source address. Both values
# cover rotation and position. 0.0 = no smoothing, 1.0 = heavy.
# LocalSmoothing: tracker running on this machine (loopback).
# RemoteSmoothing: tracker on a remote device over the network.
LocalSmoothing = 0.0
RemoteSmoothing = 0.15

# --- Position Tracking ---
PositionSensitivityX = 1.0
PositionSensitivityY = 1.0
PositionSensitivityZ = 1.0
InvertPositionX = true
InvertPositionY = false
InvertTrackerZ = false

# --- Reticle ---
ShowReticle = true
ReticleColor = 1.0,1.0,1.0,1.0
