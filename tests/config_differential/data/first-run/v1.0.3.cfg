# Gone Home Head Tracking Configuration
# Edit values below and restart the game to apply changes.
# Lines starting with # or ; are comments.

# --- Network ---
UdpPort = 4242

# --- Keybindings ---
# See https://docs.unity3d.com/ScriptReference/KeyCode.html for key names
RecenterKey = Home
ToggleKey = End
PositionToggleKey = PageUp

# --- Sensitivity ---
YawSensitivity = 1.0
PitchSensitivity = 1.0
RollSensitivity = 1.0

# --- Smoothing ---
# 0.0 = no smoothing, 1.0 = maximum. Remote connections enforce a minimum of 0.15.
Smoothing = 0.0

# --- Position Tracking ---
PositionSensitivityX = 1.0
PositionSensitivityY = 1.0
PositionSensitivityZ = 1.0
InvertPositionX = true
InvertPositionY = false
InvertPositionZ = true

# --- Reticle ---
ShowReticle = true
ReticleColor = 1.0,1.0,1.0,1.0
